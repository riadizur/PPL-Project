<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a237e;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            color: white;
            gap: 20px;
        }

        .header .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .cover-photo {
            position: relative;
            height: 250px;
            background: linear-gradient(135deg, #004d40 0%, #ff7043 50%, #ffd54f 100%);
            border-radius: 15px;
            margin-bottom: 60px;
        }

        .upload-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .profile-photo {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            background-color: #f0f0f0;
        }

        .profile-info {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .profile-info h1 {
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #bbb;
        }

        .tabs {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .tab-button {
            border: none;
            background: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }

        .tab-button.active {
            color: #1a237e;
            border-bottom: 2px solid #1a237e;
        }

        .account-form {
            background: white;
            border-radius: 10px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-value {
            font-weight: bold;
        }

        .change-btn {
            border: 1px solid #1a237e;
            background: none;
            color: #1a237e;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-email-btn {
            color: #1a237e;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .password-value {
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="favourites">❤️ Favourites</div>
            <div class="user">
                <span>John D.</span>
                <img src="/api/placeholder/40/40" alt="User avatar">
            </div>
        </header>

        <div class="cover-photo">
            <a href="#" class="upload-btn">
                ⬆️ Upload new cover
            </a>
            <img src="/api/placeholder/100/100" alt="Profile photo" class="profile-photo">
        </div>

        <div class="profile-info">
            <h1>John Doe.</h1>
            <p>john.doe@gmail.com</p>
        </div>

        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-button active">Account</button>
                <button class="tab-button">History</button>
            </div>
        </div>

        <div class="account-form">
            <div class="form-group">
                <label>Name</label>
                <div class="form-row">
                    <div class="form-value">John Doe</div>
                    <button class="change-btn">Change</button>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="form-row">
                    <div class="form-value">john.doe@gmail.com</div>
                    <div style="display: flex; gap: 10px;">
                        <a href="#" class="add-email-btn">+ Add another email</a>
                        <button class="change-btn">Change</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="form-row">
                    <div class="form-value password-value">************</div>
                    <button class="change-btn">Change</button>
                </div>
            </div>

            <div class="form-group">
                <label>Phone number</label>
                <div class="form-row">
                    <div class="form-value">+1 000-000-0000</div>
                    <button class="change-btn">Change</button>
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <div class="form-row">
                    <div class="form-value">St 32 main downtown, Los Angeles, California, USA</div>
                    <button class="change-btn">Change</button>
                </div>
            </div>

            <div class="form-group">
                <label>Date of birth</label>
                <div class="form-row">
                    <div class="form-value">01-01-1992</div>
                    <button class="change-btn">Change</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Script untuk menghandle interaktivitas form
document.addEventListener('DOMContentLoaded', function() {
    // Tab switching functionality
    const tabButtons = document.querySelectorAll('.tab-button');
    
    tabButtons.forEach(button => {
        button.addEventListener('click', () => {
            tabButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        });
    });

    // Change button functionality
    const changeButtons = document.querySelectorAll('.change-btn');
    
    changeButtons.forEach(button => {
        button.addEventListener('click', () => {
            const formGroup = button.closest('.form-group');
            const label = formGroup.querySelector('label').textContent;
            const valueDiv = formGroup.querySelector('.form-value');
            const currentValue = valueDiv.textContent;
            
            // Jika sudah dalam mode edit, simpan perubahan
            if (button.textContent === 'Save') {
                const input = formGroup.querySelector('input');
                const newValue = input.value;
                
                if (validateInput(label, newValue)) {
                    valueDiv.textContent = label === 'Password' ? '************' : newValue;
                    button.textContent = 'Change';
                    formGroup.classList.remove('editing');
                }
                return;
            }

            // Membuat input element
            const input = document.createElement('input');
            input.value = label === 'Password' ? '' : currentValue;
            input.type = getInputType(label);
            input.className = 'edit-input';
            input.style.cssText = `
                width: 100%;
                padding: 8px;
                margin-right: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            `;

            // Menambahkan placeholder sesuai field
            input.placeholder = getPlaceholder(label);

            // Menyimpan nilai asli sebagai data attribute
            valueDiv.dataset.originalValue = currentValue;
            
            // Mengganti text dengan input
            valueDiv.innerHTML = '';
            valueDiv.appendChild(input);
            
            // Mengubah teks button
            button.textContent = 'Save';
            
            // Menambahkan tombol Cancel
            if (!formGroup.querySelector('.cancel-btn')) {
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Cancel';
                cancelBtn.className = 'cancel-btn';
                cancelBtn.style.cssText = `
                    border: 1px solid #dc3545;
                    background: none;
                    color: #dc3545;
                    padding: 8px 16px;
                    border-radius: 5px;
                    cursor: pointer;
                    margin-left: 10px;
                    font-size: 14px;
                `;
                
                button.parentNode.insertBefore(cancelBtn, button.nextSibling);
                
                cancelBtn.addEventListener('click', () => {
                    valueDiv.textContent = valueDiv.dataset.originalValue;
                    button.textContent = 'Change';
                    cancelBtn.remove();
                    formGroup.classList.remove('editing');
                });
            }
            
            formGroup.classList.add('editing');
            input.focus();
        });
    });

    // Add another email functionality
    const addEmailBtn = document.querySelector('.add-email-btn');
    if (addEmailBtn) {
        addEmailBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            const emailGroup = addEmailBtn.closest('.form-group');
            const newEmailDiv = document.createElement('div');
            newEmailDiv.className = 'form-row';
            newEmailDiv.style.marginTop = '10px';
            
            const input = document.createElement('input');
            input.type = 'email';
            input.placeholder = 'Enter additional email';
            input.style.cssText = `
                flex: 1;
                padding: 8px;
                margin-right: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            `;
            
            const saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save';
            saveBtn.className = 'change-btn';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'cancel-btn';
            cancelBtn.style.cssText = `
                border: 1px solid #dc3545;
                background: none;
                color: #dc3545;
                padding: 8px 16px;
                border-radius: 5px;
                cursor: pointer;
                margin-left: 10px;
                font-size: 14px;
            `;
            
            newEmailDiv.appendChild(input);
            newEmailDiv.appendChild(saveBtn);
            newEmailDiv.appendChild(cancelBtn);
            
            emailGroup.appendChild(newEmailDiv);
            
            saveBtn.addEventListener('click', () => {
                if (validateInput('Email', input.value)) {
                    const emailValue = document.createElement('div');
                    emailValue.className = 'form-value';
                    emailValue.textContent = input.value;
                    newEmailDiv.innerHTML = '';
                    newEmailDiv.appendChild(emailValue);
                    
                    const changeBtn = document.createElement('button');
                    changeBtn.textContent = 'Change';
                    changeBtn.className = 'change-btn';
                    newEmailDiv.appendChild(changeBtn);
                    
                    // Add event listener to new change button
                    changeBtn.addEventListener('click', changeButtons[0].onclick);
                }
            });
            
            cancelBtn.addEventListener('click', () => {
                newEmailDiv.remove();
            });
        });
    }

    // Upload cover photo functionality
    const uploadBtn = document.querySelector('.upload-btn');
    if (uploadBtn) {
        uploadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Create hidden file input
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            
            document.body.appendChild(fileInput);
            
            fileInput.click();
            
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const coverPhoto = document.querySelector('.cover-photo');
                        coverPhoto.style.backgroundImage = `url(${e.target.result})`;
                        coverPhoto.style.backgroundSize = 'cover';
                        coverPhoto.style.backgroundPosition = 'center';
                    }
                    
                    reader.readAsDataURL(this.files[0]);
                }
                
                document.body.removeChild(fileInput);
            });
        });
    }
});

// Fungsi untuk validasi input
function validateInput(fieldName, value) {
    switch(fieldName.toLowerCase()) {
        case 'email':
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(value)) {
                alert('Please enter a valid email address');
                return false;
            }
            break;
            
        case 'phone number':
            const phoneRegex = /^\+?1?\d{10,}$/;
            if (!phoneRegex.test(value.replace(/[- ]/g, ''))) {
                alert('Please enter a valid phone number');
                return false;
            }
            break;
            
        case 'date of birth':
            const dateRegex = /^\d{2}-\d{2}-\d{4}$/;
            if (!dateRegex.test(value)) {
                alert('Please enter date in format DD-MM-YYYY');
                return false;
            }
            break;
            
        case 'password':
            if (value.length < 8) {
                alert('Password must be at least 8 characters long');
                return false;
            }
            break;
            
        case 'name':
            if (value.trim().length < 2) {
                alert('Name must be at least 2 characters long');
                return false;
            }
            break;
    }
    return true;
}

// Fungsi untuk mendapatkan tipe input
function getInputType(fieldName) {
    switch(fieldName.toLowerCase()) {
        case 'email':
            return 'email';
        case 'password':
            return 'password';
        case 'phone number':
            return 'tel';
        case 'date of birth':
            return 'text'; // Using text instead of date for custom format
        default:
            return 'text';
    }
}

// Fungsi untuk mendapatkan placeholder
function getPlaceholder(fieldName) {
    switch(fieldName.toLowerCase()) {
        case 'email':
            return 'Enter email address';
        case 'password':
            return 'Enter new password';
        case 'phone number':
            return 'Enter phone number (e.g. +1 000-000-0000)';
        case 'date of birth':
            return 'DD-MM-YYYY';
        case 'address':
            return 'Enter full address';
        case 'name':
            return 'Enter full name';
        default:
            return `Enter ${fieldName.toLowerCase()}`;
    }
}
        // Tab switching functionality
        const tabButtons = document.querySelectorAll('.tab-button');
        
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                tabButtons.forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                button.classList.add('active');
            });
        });

        // Change button functionality
        const changeButtons = document.querySelectorAll('.change-btn');
        
        changeButtons.forEach(button => {
            button.addEventListener('click', () => {
                const fieldName = button.closest('.form-group').querySelector('label').textContent;
                alert(`Change ${fieldName} clicked`);
            });
        });

        // Upload cover photo functionality
        const uploadBtn = document.querySelector('.upload-btn');
        
        uploadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            alert('Upload new cover photo clicked');
        });

        // Add another email functionality
        const addEmailBtn = document.querySelector('.add-email-btn');
        
        addEmailBtn.addEventListener('click', (e) => {
            e.preventDefault();
            alert('Add another email clicked');
        });
    </script>
</body>
</html>
