<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HTelin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a237e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .signup-container {
            display: flex;
            max-width: 1000px;
            width: 90%;
            margin: 20px;
            position: relative;
        }

        .image-section {
            flex: 1;
            position: relative;
        }

        .hotel-image {
            width: 100%;
            height: 600px;
            object-fit: cover;
            border-radius: 15px;
        }

        .dot-navigation {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
        }

        .dot.active {
            background: white;
        }

        .form-section {
            flex: 1;
            padding: 40px;
        }

        .qr-code {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
        }

        .signup-form h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .signup-form p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .consent-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }

        .consent-checkbox input[type="checkbox"] {
            margin-top: 5px;
        }

        .consent-checkbox label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .signup-button {
            width: 100%;
            padding: 15px;
            background: #ffc107;
            border: none;
            border-radius: 8px;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .login-link a {
            color: #ffc107;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .signup-container {
                flex-direction: column;
            }

            .image-section {
                display: none;
            }

            .form-section {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <!-- Image Section -->
        <div class="image-section">
            <img src="15.jpg" alt="Hotel View" class="hotel-image">
            <div class="dot-navigation">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <img src="assets/qr-code.png" alt="QR Code" class="qr-code">
            
            <div class="signup-form">
                <h2>Sign up</h2>
                <p>Let's set up an account so you can access your personal account.</p>

                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <input type="text" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" placeholder="Phone Number" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="password" placeholder="Password" required>
                    </div>

                    <div class="form-group">
                        <input type="password" placeholder="Confirm Password" required>
                    </div>

                    <div class="consent-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to all the Terms and Privacy Policies</label>
                    </div>

                    <button type="submit" class="signup-button">Create Account</button>

                    <div class="login-link">
                        Already have an account? <a href="login.html">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Dot navigation functionality
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                dots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                // Here you can add image slider functionality
            });
        });

        // Form validation
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = form.querySelector('input[type="password"]').value;
            const confirmPassword = form.querySelectorAll('input[type="password"]')[1].value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            // Add your form submission logic here
            console.log('Form submitted successfully');
        });
    </script>
</body>
</html>
