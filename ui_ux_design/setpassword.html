<!-- set-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - HTelin</title>
</head>
<body>
    <div class="auth-page">
        <div class="form-container">
            <img src="assets/qr-code.png" alt="QR Code" class="qr-logo">
            <h1 class="auth-title">Set a password</h1>
            <p class="auth-subtitle">Your new password must be different from previous used passwords.</p>
            
            <form>
                <div class="form-group">
                    <input type="password" placeholder="New Password">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Confirm Password">
                </div>

                <button type="submit" class="submit-button">Set Password</button>
                
                <div class="auth-link">
                    <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>
        
        <div class="image-container">
            <img src="assets/hotel-view.jpg" alt="Hotel View" class="hotel-image">
        </div>
    </div>
</body>
</html>
