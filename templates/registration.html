<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h2>Post a New Job</h2>
    <form id="post-interview-form">
        <div>
            <label for="title">Job Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div>
            <label for="company">Date:</label>
            <input type="text" id="date" name="date" required>
        </div>
        <div>
            <label for="location">Interviewer:</label>
            <input type="text" id="interviewer" name="interviewer" required>
        </div>
        <button type="submit">Post Interview</button>
    </form>

    <p id="response-message"></p>

    <script src="{{ url_for('static', filename='post_interview_script.js') }}"></script>
</body>
</html>
