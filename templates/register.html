<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
        rel="stylesheet"
        as="style"
        onload="this.rel='stylesheet'"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Plus+Jakarta+Sans%3Awght%40400%3B500%3B700%3B800"
    />
    <title>One-stop Solutions Hotel App</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

</head>
<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#FFFFFF] group/design-root overflow-x-hidden" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
            <header class="fixed top-0 left-0 right-0 flex items-center justify-between border-b border-[#F4EFE6] px-6 md:px-10 py-3 bg-white">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-4 text-[#1C160C]">
                        <div class="size-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 25" width="40" height="40" style="margin-top: -10;">
                                <!-- Background building silhouette -->
                                <rect x="5" y="10" width="15" height="10" rx="2" fill="#2C3E50"/>
                                <!-- Window elements -->
                                <rect x="6" y="11" width="3" height="3" rx="1" fill="#ECF0F1"/>
                                <rect x="10" y="11" width="3" height="3" rx="1" fill="#ECF0F1"/>
                                <rect x="14" y="11" width="3" height="3" rx="1" fill="#ECF0F1"/>
                                <!-- Door -->
                                <rect x="9" y="15" width="7" height="7" rx="1" fill="#3498DB"/>
                                <!-- Roof -->
                                <path d="M2 10 L12 2 L22 10" fill="none" stroke="#E74C3C" stroke-width="1"/>
                                <!-- Moon element -->
                                <circle cx="20" cy="4" r="2" fill="#F1C40F"/>
                                <!-- Bed icon -->
                                <path d="M6 17 Q6 15 8 15 L10 15 Q12 15 12 17" fill="none" stroke="#3498DB" stroke-width="1"/>
                                <rect x="7" y="17" width="5" height="0.5" fill="#3498DB"/>
                            </svg>              
                        </div>
                        <h2 class="text-[#1C160C] text-lg font-bold leading-tight" style="margin-top:15px;">&nbsp;&nbsp;DailyRoom</h2>
                    </div>
                </div>
            </header>
            <div style="margin-top:40px;"></div>
            <div class="px-6 md:px-40 flex flex-1 justify-center py-5">
                <div class="iframe-container">
                    <iframe src="/static/html/customer_registration_form.html" frameborder="0"></iframe>
                </div>
            </div>
        </div>
    </div>

      <style>
        .iframe-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none; /* Remove default border */
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /*Stay in place*/
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background-color: rgba(0, 0, 0, 0.7); /* Black background with transparency */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
        }
  
        /* Modal content */
        .modal-content {
            background-color: #fff; /* White background for content */
            border-radius: 10px; /* Rounded corners */
            padding: 20px; /* Some padding */
            max-width: 500px; /* Maximum width */
            width: 90%; /* Responsive width */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Shadow for depth */
        }
  
      .modal-image {
          width: 100%;
          height: 200px;
          background-size: cover;
          background-position: center;
      }
  
      .close {
          cursor: pointer;
          font-size: 20px;
          position: absolute;
          right: 10px;
          top: 10px;
      }
      </style>
      <!-- <script src="/static/js/hotels.js"></script> -->
  </body>
