<html>
  <head>
    <style>
      video {
        width: 640px;
        height: 480px;
        border: 2px solid #333;
        border-radius: 8px;
      }
      iframe {
        width: 560px;
        height: 315px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Career-Hiring Day</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#FFFFFF] group/design-root overflow-x-hidden" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
      <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between border-b border-[#F4EFE6] px-6 md:px-10 py-3">
          <div class="flex items-center gap-8">
            <div class="flex items-center gap-4 text-[#1C160C]">
              <div class="size-4">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <g clip-path="url(#clip0_6_330)">
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z"
                      fill="currentColor"
                    ></path>
                  </g>
                  <defs>
                    <clipPath id="clip0_6_330"><rect width="48" height="48" fill="white"></rect></clipPath>
                  </defs>
                </svg>
              </div>
              <h2 class="text-[#1C160C] text-lg font-bold leading-tight">Career-Hiring Day</h2>
            </div>
            <label class="flex min-w-40 max-w-64 h-10">
              <div class="flex w-full items-stretch rounded-xl h-full">
                <div class="text-[#A18249] flex bg-[#F4EFE6] items-center justify-center pl-4 rounded-l-xl border-r-0">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
                  </svg>
                </div>
                <input
                  placeholder="Search"
                  class="form-input flex w-full h-full rounded-r-xl text-[#1C160C] focus:outline-none focus:ring-0 border-none bg-[#F4EFE6] placeholder:text-[#A18249] px-4"
                />
              </div>
            </label>
          </div>
          <div class="flex flex-1 justify-end gap-6">
            <div class="flex items-center gap-6">
              <a class="text-[#1C160C] text-sm font-medium" href="/">For You</a>
              <a class="text-[#1C160C] text-sm font-medium" href="/">Remote</a>
              <a class="text-[#1C160C] text-sm font-medium" href="/">Engineering</a>
              <a class="text-[#1C160C] text-sm font-medium" href="/">Design</a>
            </div>
            <div class="flex gap-2">
              <button class="flex items-center justify-center rounded-full h-10 px-4 bg-[#019863] text-[#FFFFFF] text-sm font-bold transition hover:bg-[#017855]">
                <span class="truncate">Post a job</span>
              </button>
              <button class="flex items-center justify-center rounded-full h-10 px-4 bg-[#F4EFE6] text-[#1C160C] text-sm font-bold transition hover:bg-[#E1D4B3]">
                <span class="truncate">For Employer</span>
              </button>
            </div>
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" style='background-image: url("https://cdn.usegalileo.ai/stability/2f075930-ffd6-4841-9270-99cc6e9d54ee.png");'></div>
          </div>
        </header>
        <div class="relative flex size-full min-h-screen flex-col bg-slate-50 group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
          <div class="flex items-center bg-slate-50 p-4 pb-2 justify-between">
            <div onclick="window.open('/admin','__self');" class="text-[#0e141b] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
              </svg>
            </div>
            <h2 class="text-[#0e141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Interviews Page</h2>
          </div>
          <div class="flex items-center gap-4 bg-slate-50 px-4 min-h-[72px] py-2">
            <div
              class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-14 w-fit"
              style='background-image: url("https://cdn.usegalileo.ai/stability/93c3944e-961e-4e9b-802c-2b578c45e8d4.png");'
            ></div>
            <div class="flex flex-col justify-center">
              <p class="text-[#0e141b] text-base font-medium leading-normal line-clamp-1">Software Engineer</p>
              <p class="text-[#4e7397] text-sm font-normal leading-normal line-clamp-2">Google</p>
            </div>
          </div>
          <div class="flex items-left gap-4 bg-slate-50 px-4 min-h-14 justify-between">
            <p class="text-[#0e141b] text-base font-normal leading-normal flex-1 truncate">Mar 6, 10:00 AM</p>
            <div class="shrink-0">
              <div class="flex size-7 items-left justify-left"><div class="size-3 rounded-full bg-[#078838]"></div></div>
            </div>
          </div>
          <div class="flex justify-left">
            <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 max-w-[150px] justify-left">
              <h3 class="text-[#0e141b] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Interview Kit</h3>
              <div class="flex items-left gap-3 bg-slate-50 px-4 min-h-14"><p class="text-[#0e141b] text-base font-normal leading-normal flex-1 truncate">Scorecard</p></div>
              <div class="flex items-left gap-3 bg-slate-50 px-4 min-h-14"><p class="text-[#0e141b] text-base font-normal leading-normal flex-1 truncate">Feedback</p></div>
              <div class="flex items-left gap-3 bg-slate-50 px-4 min-h-14"><p class="text-[#0e141b] text-base font-normal leading-normal flex-1 truncate">Plan</p></div>
            </div>
            <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 max-w-[480px] justify-center">
              <video id="camera-feed" autoplay></video>
            </div>
            <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 max-w-[480px] justify-center">
              <iframe 
                src="https://www.youtube.com/embed/SV_OnavyXHM" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
              </iframe>
            </div>
          </div>
          <div class="flex justify-center">
            <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 max-w-[480px] justify-center">
              <button
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#1980e6] text-slate-50 text-sm font-bold leading-normal tracking-[0.015em] grow"
              >
                <span class="truncate" id="start-camera">Start Interview</span>
              </button>
              <button
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#e7edf3] text-[#0e141b] text-sm font-bold leading-normal tracking-[0.015em] grow"
              >
                <span class="truncate">Copy Link</span>
              </button>
            </div>
          </div>
          <div class="h-5 bg-slate-50"></div>
        </div>
      </div>
    </div>
    <script>
      const video = document.getElementById('camera-feed');
      const button = document.getElementById('start-camera');
  
      button.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
        } catch (err) {
          console.log(err.name + ": " + err.message);
          alert("Failed to access camera. Error: " + err.message);
        }
      });
    </script>
  </body>
</html>
