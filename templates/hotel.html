        /* body {

        .container { 
            background-color: white; 
            padding: 20px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); 
            border-radius: 8px; 
            margin-top: 20px;
        }
        h2 { 
            text-align: center; 
            color: #333;
        }
        .hidden { display: none; }
        label { 
            display: block; 
            margin: 10px 0 5px; 
            font-weight: bold;
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            padding: 10px 20px; 
            background-color: #007BFF; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 4px; 
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        button:hover { 
            background-color: #0056b3; 
        }
        .confirmation { 
            padding: 15px;
            background-color: #e9f7ef; 
            border: 1px solid #d4edda;
            border-radius: 4px;
            margin-top: 15px;
        }
        .confirmation h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        .confirmation p {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .confirmation strong {
            color: #333;
        }
        /* Progress Bar */
        .progress-bar { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            background-color: #f5f5f5;
        }

        .progress-step { 
            flex: 1; 
            padding: 10px 0; 
            text-align: center; 
            position: relative;
            color: gray;
            font-size: 14px;
        }

        .progress-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 120%;
            right: 0;
            height: 4px;
            width: 100%;
            background-color: lightgray;
            z-index: 0;
            transform: translateY(-50%);
        }

        .progress-step.active, .progress-step.completed {
            color: #007BFF;
            font-weight: bold;
        }

        .progress-step.active::after, .progress-step.completed::after {
            background-color: #007BFF;
        }

        .progress-step.completed { 
            color: #28a745; 
        }


      .job-card {
        background-color: #F9F9F9;
        border-radius: 12px;
        padding: 16px;
        transition: transform 0.2s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .job-card:hover {
        transform: translateY(-4px);
      }

      .filter-button {
        background-color: #F4EFE6;
        color: #1C160C;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 4px;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.2s ease;
      }

      .filter-button:hover {
        background-color: #E1D4B3;
      }
    </style>
