<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center mb-6">Login to Your Account</h2>
        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required class="mt-1 p-2 border border-gray-300 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="you@example.com">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required class="mt-1 p-2 border border-gray-300 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-900">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" onclick="parent.window.location.href = '/forgot-password';" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
                </div>
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200">Login</button>
        </form>
        <div id="response-message" class="mt-4 text-center text-sm text-red-500 hidden"></div>
        <div class="mt-4 text-center">
            <p class="text-sm text-gray-600">Don't have an account? <a href="#" onclick="parent.window.location.href = '/register';" class="text-blue-600 hover:text-blue-500 font-medium">Sign up</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Prepare the request payload
            const payload = {
                email: email,
                password: password
            };

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    // Handle successful login
                    alert(result.message); // Replace with your success logic
                    // Store the user's name and login status in local storage
                    localStorage.setItem('customerName', result.name); // Assuming the response contains this field
                    localStorage.setItem('isLoggedIn', 'true'); // Set login status

                    // Update the UI to show the customer's name instead of the login button
                    // updateUIWithCustomerName(result.customerName);

                    // Redirect to the dashboard or home page
                    parent.window.location.href = '/'; // Update this URL as needed
                } else {
                    // Handle login error
                    const responseMessage = document.getElementById('response-message');
                    responseMessage.textContent = result.message;
                    responseMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error during login:', error);
                const responseMessage = document.getElementById('response-message');
                responseMessage.textContent = 'An error occurred. Please try again.';
                responseMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
