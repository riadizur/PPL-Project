<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        :root {
            --primary-blue: #1a237e;
            --primary-yellow: #FFA000;
            --light-text: #B0B0B0;
        }

        body {
            min-height: 100vh;
            background-color: var(--primary-blue);
            position: relative;
            overflow: hidden;
        }

        .background-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            top: 30%;
            right: -50px;
        }

        .container {
            position: relative;
            padding: 40px 24px;
            height: 100vh;
            z-index: 1;
        }

        .back-button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-title {
            color: white;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--light-text);
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            color: var(--light-text);
            font-size: 12px;
            text-transform: uppercase;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 16px;
            width: 100%;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-yellow);
        }

        .remember-me label {
            color: var(--light-text);
            font-size: 14px;
        }

        .forgot-password {
            color: var(--light-text);
            text-decoration: none;
            font-size: 14px;
        }

        .login-button {
            background-color: var(--primary-yellow);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="background-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>
    
    <div class="container">
        <button class="back-button" onclick="history.back()">←</button>
        
        <div class="login-header">
            <h1 class="login-title">Login</h1>
            <p class="login-subtitle">Login to access your hotel in account</p>
        </div>

        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label class="input-label">EMAIL</label>
                <input 
                    type="email" 
                    class="input-field" 
                    placeholder="john.doe@gmail.com" 
                    required
                >
            </div>

            <div class="input-group">
                <label class="input-label">EMAIL</label>
                <input 
                    type="email" 
                    class="input-field" 
                    placeholder="john.doe@gmail.com" 
                    required
                >
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot Password</a>
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            // Add login logic here
            window.location.href = 'scanner.html';
        }
    </script>
</body>
</html>
