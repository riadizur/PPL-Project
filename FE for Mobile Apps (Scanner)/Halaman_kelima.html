<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        :root {
            --primary-blue: #1a237e;
            --primary-yellow: #FFA000;
            --light-text: rgba(255, 255, 255, 0.9);
            --dim-text: rgba(255, 255, 255, 0.6);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #303f9f 100%);
            padding: 20px 20px 90px;
            position: relative;
        }

        /* Background Decorations */
        .background-shapes {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: 20%;
            left: -50px;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .page-title {
            color: var(--light-text);
            font-size: 28px;
            font-weight: 600;
        }

        .filter-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--light-text);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* History List */
        .history-list {
            position: relative;
            z-index: 1;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-yellow);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .room-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-name {
            color: var(--light-text);
            font-weight: 600;
            font-size: 16px;
        }

        .scan-status {
            color: var(--primary-yellow);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--dim-text);
            font-size: 14px;
        }

        .detail-icon {
            opacity: 0.7;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 35, 126, 0.95) 100%);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            gap: 8px;
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-icon.active {
            background: var(--primary-yellow);
            box-shadow: 0 4px 15px rgba(255, 160, 0, 0.3);
        }

        .nav-label {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.8;
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .history-item {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .history-item:nth-child(1) { animation-delay: 0.1s; }
        .history-item:nth-child(2) { animation-delay: 0.2s; }
        .history-item:nth-child(3) { animation-delay: 0.3s; }
        .history-item:nth-child(4) { animation-delay: 0.4s; }
        .history-item:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <!-- Background Shapes -->
    <div class="background-shapes">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <h1 class="page-title">History</h1>
        <button class="filter-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
            </svg>
            Filter
        </button>
    </header>

    <!-- History List -->
    <div class="history-list">
        <div class="history-item">
            <div class="history-header">
                <div class="room-info">
                    <div class="room-icon">
                        <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                            <path d="M19 19V4h-4V3H5v16H3v2h12V6h2v15h4v-2h-2zm-6 0H7V5h6v14zm-3-8h2v2h-2v-2z"/>
                        </svg>
                    </div>
                    <div class="room-details">
                        <span class="room-name">Room 101</span>
                        <span class="scan-status">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                            </svg>
                            Successfully Scanned
                        </span>
                    </div>
                </div>
            </div>
            <div class="history-details">
                <div class="detail-group">
                    <svg class="detail-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/>
                    </svg>
                    10:30 AM
                </div>
                <div class="detail-group">
                    <svg class="detail-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
                    </svg>
                    Today
                </div>
            </div>
        </div>

        <!-- Repeat similar history items with different data -->
        <!-- Item 2 -->
        <div class="history-item">
            <!-- Similar structure with different room number and time -->
            <div class="history-header">
                <div class="room-info">
                    <div class="room-icon">
                        <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                            <path d="M19 19V4h-4V3H5v16H3v2h12V6h2v15h4v-2h-2zm-6 0H7V5h6v14zm-3-8h2v2h-2v-2z"/>
                        </svg>
                    </div>
                    <div class="room-details">
                        <span class="room-name">Room 102</span>
                        <span class="scan-status">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                            </svg>
                            Successfully Scanned
                        </span>
                    </div>
                </div>
            </div>
            <div class="history-details">
                <div class="detail-group">
                    <svg class="detail-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/>
                    </svg>
                    09:15 AM
                </div>
                <div class="detail-group">
                    <svg class="detail-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
                    </svg>
                    Today
                </div>
            </div>
        </div>

        <!-- Add more history items as needed -->
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <div class="nav-icon">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <span class="nav-label">Account</span>
        </a>

        <a href="#" class="nav-item">
            <div class="nav-icon">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.92-2 2-2z"/>
                </svg>
            </div>
            <span class="nav-label">Scan</span>
        </a>

        <a href="#" class="nav-item">
            <div class="nav-icon active">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/>
                </svg>
            </div>
            <span class="nav-label">History</span>
        </a>
    </nav>

    <script>
        // Filter button handler
        document.querySelector('.filter-button').addEventListener('click', () => {
            // Implement filter functionality
            showFilterModal();
        });

        // Show filter modal
        function showFilterModal() {
            const modal = document.createElement('div');
            modal.className = 'filter-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Filter History</h3>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" checked> Today
                        </label>
                        <label class="filter-option">
                            <input type="checkbox"> This Week
                        </label>
                        <label class="filter-option">
                            <input type="checkbox"> This Month
                        </label>
                    </div>
                    <div class="modal-buttons">
                        <button class="cancel-btn">Cancel</button>
                        <button class="apply-btn">Apply</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            // Add modal styles
            const style = document.createElement('style');
            style.textContent = `
                .filter-modal {
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0, 0, 0, 0.5);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1000;
                    animation: fadeIn 0.3s ease;
                }

                .modal-content {
                    background: white;
                    border-radius: 20px;
                    padding: 24px;
                    width: 90%;
                    max-width: 400px;
                }

                .modal-content h3 {
                    color: var(--primary-blue);
                    margin-bottom: 20px;
                }

                .filter-options {
                    display: flex;
                    flex-direction: column;
                    gap: 15px;
                    margin-bottom: 24px;
                }

                .filter-option {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    color: #333;
                    font-size: 16px;
                }

                .modal-buttons {
                    display: flex;
                    justify-content: flex-end;
                    gap: 12px;
                }

                .modal-buttons button {
                    padding: 12px 24px;
                    border-radius: 12px;
                    border: none;
                    font-weight: 600;
                    cursor: pointer;
                }

                .cancel-btn {
                    background: #f5f5f5;
                    color: #333;
                }

                .apply-btn {
                    background: var(--primary-yellow);
                    color: white;
                }

                @keyframes fadeIn {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }
            `;
            document.head.appendChild(style);

            // Handle modal interactions
            modal.querySelector('.cancel-btn').onclick = () => modal.remove();
            modal.querySelector('.apply-btn').onclick = () => {
                // Implement filter application logic
                modal.remove();
            };
        }

        // History item click handler
        document.querySelectorAll('.history-item').forEach(item => {
            item.addEventListener('click', () => {
                showHistoryDetails(item);
            });
        });

        // Show history details
        function showHistoryDetails(item) {
            const roomName = item.querySelector('.room-name').textContent;
            const scanTime = item.querySelector('.detail-group').textContent;
            
            // Create and show details modal
            const detailsModal = document.createElement('div');
            detailsModal.className = 'details-modal';
            detailsModal.innerHTML = `
                <div class="modal-content">
                    <div class="details-header">
                        <h3>${roomName}</h3>
                        <button class="close-btn">&times;</button>
                    </div>
                    <div class="details-body">
                        <div class="detail-row">
                            <span class="detail-label">Scan Time</span>
                            <span class="detail-value">${scanTime}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status</span>
                            <span class="detail-value success">Success</span>
                        </div>
                        <div class="details-qr">
                            <img src="qr-placeholder.png" alt="QR Code">
                        </div>
                    </div>
                </div>
            `;

            // Add modal styles
            const style = document.createElement('style');
            style.textContent = `
                .details-modal {
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0, 0, 0, 0.5);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 1000;
                    animation: slideUp 0.3s ease;
                }

                .details-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 20px;
                }

                .close-btn {
                    background: none;
                    border: none;
                    font-size: 24px;
                    cursor: pointer;
                }

                .detail-row {
                    display: flex;
                    justify-content: space-between;
                    padding: 12px 0;
                    border-bottom: 1px solid #eee;
                }

                .detail-label {
                    color: #666;
                }

                .detail-value.success {
                    color: #4CAF50;
                }

                .details-qr {
                    margin-top: 20px;
                    text-align: center;
                }

                @keyframes slideUp {
                    from {
                        transform: translateY(100px);
                        opacity: 0;
                    }
                    to {
                        transform: translateY(0);
                        opacity: 1;
                    }
                }
            `;
            document.head.appendChild(style);

            document.body.appendChild(detailsModal);
            detailsModal.querySelector('.close-btn').onclick = () => detailsModal.remove();
        }

        // Navigation handling
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-icon').forEach(icon => {
                    icon.classList.remove('active');
                });
                this.querySelector('.nav-icon').classList.add('active');
            });
        });

        // Add smooth scroll behavior
        const historyList = document.querySelector('.history-list');
        let lastScrollTop = 0;

        historyList.addEventListener('scroll', () => {
            const st = historyList.scrollTop;
            if (st > lastScrollTop) {
                // Scrolling down
                document.querySelector('.bottom-nav').style.transform = 'translateY(100%)';
            } else {
                // Scrolling up
                document.querySelector('.bottom-nav').style.transform = 'translateY(0)';
            }
            lastScrollTop = st;
        });

        // Initialize page with animation
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
