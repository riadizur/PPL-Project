<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Room Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        :root {
            --primary-blue: #1a237e;
            --primary-yellow: #FFA000;
            --gradient-yellow: linear-gradient(135deg, #FFA000 0%, #FFB300 100%);
        }

        body {
            min-height: 100vh;
            background: var(--primary-blue);
            position: relative;
            overflow: hidden;
        }

        /* Background Animation */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            background: var(--gradient-yellow);
            border-radius: 0 0 50% 50%;
            width: 200%;
            height: 45%;
            left: -50%;
            top: -20%;
            animation: waveAnimation 15s infinite linear;
        }

        .wave-2 {
            background: rgba(255, 160, 0, 0.5);
            animation-delay: -5s;
        }

        @keyframes waveAnimation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* QR Logo Container */
        .qr-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
            perspective: 1000px;
        }

        .qr-box {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: floatAnimation 3s ease-in-out infinite;
        }

        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0) rotateY(0); }
            50% { transform: translateY(-20px) rotateY(10deg); }
        }

        .qr-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .qr-code {
            width: 70%;
            height: 70%;
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 15px;
            animation: pulseAnimation 2s infinite;
        }

        .qr-element {
            background: var(--primary-blue);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .qr-element::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmerAnimation 2s infinite;
        }

        @keyframes pulseAnimation {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.95); }
        }

        @keyframes shimmerAnimation {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Text Content */
        .content {
            text-align: center;
            color: white;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.5s;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.7s;
        }

        /* Start Button */
        .start-button {
            background: var(--gradient-yellow);
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 160, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.9s;
            position: relative;
            overflow: hidden;
        }

        .start-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            animation: buttonShine 3s infinite;
        }

        .start-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(255, 160, 0, 0.4);
        }

        @keyframes buttonShine {
            0% { transform: translateX(-100%); }
            20%, 100% { transform: translateX(100%); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="wave"></div>
        <div class="wave wave-2"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="qr-container">
            <div class="qr-box">
                <div class="qr-frame">
                    <div class="qr-code">
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                        <div class="qr-element"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content">
            <h1 class="title">Scan Your Room!</h1>
            <p class="subtitle">Quick and secure access to your room information</p>
            <button class="start-button" onclick="window.location.href='login.html'">
                Let's Start
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random size
                const size = Math.random() * 5 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                
                // Random animation duration
                const duration = Math.random() * 10 + 10;
                particle.style.animationDuration = `${duration}s`;
                
                // Random delay
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles
        document.addEventListener('DOMContentLoaded', createParticles);

        // Button click effect
        document.querySelector('.start-button').addEventListener('click', function(e) {
            const button = this;
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - button.offsetLeft - radius}px`;
            circle.style.top = `${e.clientY - button.offsetTop - radius}px`;
            circle.classList.add('ripple');

            button.appendChild(circle);

            setTimeout(() => circle.remove(), 600);
        });
        
    </script>
</body>
</html>
